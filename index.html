                    <i class="fa-solid fa-table-cells"></i>

    <!-- Scripts da Lógica do Aplicativo -->
    <script>
        // Configuração inicial de linhas (como na screenshot: 34 linhas)
        const TOTAL_ROWS = 34;
        const sheetBody = document.getElementById('sheet-body');
        const grandTotalElement = document.getElementById('grand-total');
        const formulaBar = document.getElementById('formula-bar');

        // Estrutura de dados das linhas
        let rowData = Array.from({ length: TOTAL_ROWS }, () => ({ price: 0, qty: 0 }));

        // Histórico para botão "Desfazer"
        let historyStack = [];

        function saveState() {
            if (historyStack.length > 20) historyStack.shift();
            historyStack.push(JSON.stringify(rowData));
        }

        function undo() {
            if (historyStack.length > 0) {
                rowData = JSON.parse(historyStack.pop());
                renderTable();
                calculateTotals();
            }
        }

        // Formatação para Moeda Brasileira (R$)
        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Função auxiliar para calcular o total de uma linha
        // Regra: se o preço foi informado e a quantidade for 0 ou em branco, considera 1 unidade (preço x 1)
        function getRowTotal(row) {
            if (row.price <= 0) return 0;
            const effectiveQty = row.qty > 0 ? row.qty : 1;
            return row.price * effectiveQty;
        }

        // Renderiza a planilha na tela
        function renderTable() {
            sheetBody.innerHTML = '';

            rowData.forEach((row, index) => {
                const rowNum = index + 2; // Começa na linha 2 conforme a imagem
                const total = getRowTotal(row);

                const tr = document.createElement('tr');
                tr.className = 'text-center hover:bg-gray-50';

                tr.innerHTML = `
                    <!-- Número da Linha -->
                    <td class="bg-gray-100 text-gray-500 border border-gray-300 font-medium text-xs select-none py-1">
                        ${rowNum}
                    </td>

                    <!-- Coluna F: Preço (Roxo Claro) -->
                    <td class="bg-purple-cell border border-gray-300 p-0 relative">
                        <input type="number" step="0.01" min="0" 
                            class="excel-input text-gray-800" 
                            placeholder="0,00"
                            value="${row.price > 0 ? row.price : ''}" 
                            onfocus="setFormulaBar('F${rowNum}: Preço = ' + this.value)"
                            oninput="updateRow(${index}, 'price', this.value)">
                    </td>

                    <!-- Coluna G: Quantidade (Roxo Claro) -->
                    <td class="bg-purple-cell border border-gray-300 p-0 relative">
                        <input type="number" step="1" min="0" 
                            class="excel-input text-gray-800" 
                            placeholder="0"
                            value="${row.qty > 0 ? row.qty : ''}" 
                            onfocus="setFormulaBar('G${rowNum}: Quantidade = ' + this.value)"
                            oninput="updateRow(${index}, 'qty', this.value)">
                    </td>

                    <!-- Coluna H: Total (Verde Claro) -->
                    <td class="bg-green-cell border border-gray-300 font-medium text-green-900 py-1 text-xs select-none">
                        ${total > 0 ? formatCurrency(total).replace('R$', '').trim() : '0'}
                    </td>

                    <!-- Botão de exclusão rápida de linha -->
                    <td class="bg-gray-50 border border-gray-300 text-center">
                        <button onclick="clearRow(${index})" class="text-gray-300 hover:text-red-500 px-1 text-xs" title="Limpar linha">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                `;

                sheetBody.appendChild(tr);
            });
        }

        // Atualiza valor de uma célula específica
        function updateRow(index, field, value) {
            saveState();
            const parsedVal = parseFloat(value) || 0;
            rowData[index][field] = parsedVal;
            
            // Atualiza linha e totais sem re-renderizar toda a tabela para manter o foco
            calculateTotals();
            updateRowTotalDisplay(index);
        }

        // Atualiza apenas a célula H (Total) da linha modificada
        function updateRowTotalDisplay(index) {
            const totalCell = sheetBody.children[index].children[3];
            const total = getRowTotal(rowData[index]);
            totalCell.textContent = total > 0 ? formatCurrency(total).replace('R$', '').trim() : '0';
        }

        // Recalcula o Total Final
        function calculateTotals() {
            const grandTotal = rowData.reduce((acc, row) => acc + getRowTotal(row), 0);
            grandTotalElement.textContent = formatCurrency(grandTotal);
        }

        // Atualiza a barra de fórmula (fx) ao focar na célula
        function setFormulaBar(text) {
            formulaBar.value = text;
        }

        // Adiciona nova linha
        function addRow() {
            saveState();
            rowData.push({ price: 0, qty: 0 });
            renderTable();
            calculateTotals();
        }

        // Limpa uma linha específica
        function clearRow(index) {
            saveState();
            rowData[index] = { price: 0, qty: 0 };
            renderTable();
            calculateTotals();
        }

        // Limpa todos os dados
        function clearAll() {
            if (confirm('Deseja limpar todos os valores digitados na planilha?')) {
                saveState();
                rowData = rowData.map(() => ({ price: 0, qty: 0 }));
                renderTable();
                calculateTotals();
                formulaBar.value = '';
            }
        }

        // Inicialização
        window.onload = function() {
            renderTable();
            calculateTotals();
        };
    </script>
</body>
</html>
